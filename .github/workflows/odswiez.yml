name: Odśwież półkę

on:
  schedule:
    - cron: "17 4 * * *"   # codziennie ok. 6:17 czasu polskiego
  workflow_dispatch:         # przycisk „Run workflow” w zakładce Actions

permissions:
  contents: write

concurrency:
  group: odswiez
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Pobierz apki i opisz je
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python fetch.py

      - name: Zapisz zmiany
        if: always()   # zapisz to, co zdążyło się zrobić, nawet po błędzie
        run: |
          git config user.name "otwarta-polka-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A docs cache
          git diff --cached --quiet || git commit -m "Odświeżenie danych $(date -u +%F)"
          git push
